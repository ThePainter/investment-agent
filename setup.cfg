[metadata]
name = investment-agent
version = 0.1.0
description = Decision-support stock signal dashboard with technical analysis, news, and portfolio tracking.

[options]
packages = find:
python_requires = >=3.9
install_requires =
    apscheduler>=3.10.4
    fastapi>=0.111.0
    feedparser>=6.0.11
    httpx>=0.27.0
    numpy>=1.26.4
    pandas>=2.2.2
    plotly>=5.22.0
    pydantic>=2.7.4
    pydantic-settings>=2.3.4
    python-dotenv>=1.0.1
    pyyaml>=6.0.1
    sqlalchemy>=2.0.30
    streamlit>=1.35.0
    uvicorn[standard]>=0.30.1
    yfinance>=0.2.40

[options.packages.find]
include = app*

[options.extras_require]
dev =
    pytest>=8.2.2
    pytest-cov>=5.0.0
