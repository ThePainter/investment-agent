services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  dashboard:
    build: .
    env_file:
      - .env
    environment:
      API_URL: http://api:8000/api
    ports:
      - "8501:8501"
    volumes:
      - ./config:/app/config
    depends_on:
      - api
    command: streamlit run frontend/streamlit_app.py --server.address 0.0.0.0 --server.port 8501

